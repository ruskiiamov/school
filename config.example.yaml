school:
  name: "Школа №1"
  year_start_month: 8

timezone: Europe/Moscow

http:
  addr: ":8080"
  read_timeout: 5s
  write_timeout: 10s
  idle_timeout: 60s
  shutdown_timeout: 10s

db:
  path: ./data/school.db

log:
  file: ./logs/app.log
  level: info
  stdout: true
  max_size_mb: 10
  max_backups: 5
  max_age_days: 30
  compress: true

session:
  cookie_name: sid
  ttl: 12h
  secure: false
  cleanup_interval: 1h

journal:
  cleanup_interval: 24h

files:
  dir: ./data/files
  max_file_size_mb: 10
  max_per_lesson: 10
  transfer_timeout: 5m

admin:
  login: admin
  # обязательно замените: с этим значением сервер не запустится
  password: change-me
  last_name: Иванова
  first_name: Мария
  # отчество можно не указывать
  middle_name: Петровна
