# Пример для nginx, если он уже стоит. Сертификат — certbot (пакет python3-certbot-nginx):
#   certbot --nginx -d school.example.org
# Скопируйте в /etc/nginx/sites-available/school, включите символической ссылкой
# в sites-enabled, замените домен, затем: nginx -t && systemctl reload nginx

server {
    listen 80;
    listen [::]:80;
    server_name school.example.org;

    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name school.example.org;

    # Пути подставит certbot
    ssl_certificate /etc/letsencrypt/live/school.example.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/school.example.org/privkey.pem;

    # Загрузка файлов ДЗ: до files.max_file_size_mb × files.max_per_lesson за запрос
    client_max_body_size 110m;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;

        # Host нужен приложению для защиты форм, X-Forwarded-Proto — для проверки cookie
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # Загрузка и скачивание идут потоком, без буферизации на диск nginx
        proxy_request_buffering off;
        proxy_buffering off;

        # Не меньше files.transfer_timeout
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
